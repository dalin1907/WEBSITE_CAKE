{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h3>Tra cứu đơn hàng</h3>
    <form method="get" action="{% url 'payments:track_order_by_token' %}">
        <label for="token">Nhập mã đơn hàng (Token):</label>
        <input type="text" name="token" id="token" class="form-control" required>
        <button type="submit" class="btn btn-primary mt-3">Tra cứu</button>
    </form>
</div>
{% endblock %}
