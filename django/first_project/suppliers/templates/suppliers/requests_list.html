{% extends "base.html" %}
{% block content %}
  <div class="container py-4">
    <h1>Yêu cầu cung cấp mới</h1>
    {% for r in requests %}
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">{{ r.title }}</h5>
          <p class="card-text">{{ r.description|linebreaks }}</p>
          <p class="card-text"><strong>Số lượng:</strong> {{ r.quantity }} {{ r.unit }}</p>
          <a href="{% url 'suppliers:request_detail' r.pk %}" class="btn btn-primary">Xem chi tiết</a>
        </div>
      </div>
    {% empty %}
      <p>Không có yêu cầu mới.</p>
    {% endfor %}
  </div>
{% endblock %}
