{% extends "base.html" %}
{% block content %}
  <div class="container py-4">
    <h2>Gửi thông tin giao hàng cho Request #{{ order.pk }}</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Upload</button>
    </form>
  </div>
{% endblock %}
