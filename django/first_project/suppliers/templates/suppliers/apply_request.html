{% extends "base.html" %}
{% block content %}
  <div class="container py-4">
    <h2>Gửi đề xuất cho Request #{{ order.pk }}</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Gửi</button>
      <a class="btn btn-secondary" href="{% url 'suppliers:request_detail' order.pk %}">Quay lại</a>
    </form>
  </div>
{% endblock %}
